name: Manage Release PRs and Publish Crates

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Create or update release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify versions and publish crates
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Parse workspace metadata once for both version verification and publishing.
          METADATA=$(cargo metadata --no-deps --format-version 1)

          VERSION=$(echo "$METADATA" | jq -r \
            '.packages[] | select(.name == "fg-stitch") | .version')

          MISMATCHES=$(echo "$METADATA" | jq -r \
            --arg ver "$VERSION" \
            '.packages[] | select(.name | startswith("fg-stitch")) | select(.version != $ver) | "\(.name) \(.version)"')
          if [ -n "$MISMATCHES" ]; then
            echo "ERROR: workspace version drift detected (expected $VERSION):"
            echo "$MISMATCHES"
            exit 1
          fi
          echo "All workspace crates at v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Publishing all workspace crates (v$VERSION)..."

          # Workspace crates in topological (dependency) order.
          # Leaf crates first, root crate last.  Update this list when
          # adding new workspace crates or changing inter-crate dependencies.
          CRATES=(
            fg-stitch-lib
            fg-stitch
          )

          PUBLISHED=false
          for crate in "${CRATES[@]}"; do
            CRATE_MAX_VERSION=$(curl -sS \
              -H "User-Agent: stitch-ci (https://github.com/fulcrumgenomics/stitch)" \
              "https://crates.io/api/v1/crates/${crate}" | jq -r \
              '.crate.max_version // "0.0.0"')

            if [ "$CRATE_MAX_VERSION" = "$VERSION" ]; then
              echo "$crate v$VERSION already exists on crates.io -- skipping"
              continue
            fi

            echo "Publishing $crate v$VERSION..."
            cargo publish -p "$crate"
            echo "Published $crate v$VERSION"
            PUBLISHED=true

            # Allow registry index to propagate before publishing dependent crates.
            sleep 30
          done

          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.publish.outputs.version }}"
          TAG="v${VERSION}"

          # Idempotent: skip if tag/release already exist (e.g. from a
          # previous partial run that published crates but failed here).
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          if ! git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "v${VERSION}" \
              --generate-notes \
              --latest
          else
            echo "Release $TAG already exists -- skipping"
          fi
